<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen Receiver 送信ページ</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
  h1 { font-size: 1.4rem; }
  .row { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1rem 0; }
  label { display: flex; flex-direction: column; font-size: .85rem; gap: .2rem; }
  select, button { font-size: 1rem; padding: .5rem .8rem; }
  button.primary { font-weight: bold; }
  .problem { background: #fdd; color: #600; padding: .6rem 1rem; border-radius: .4rem; margin: .5rem 0; }
  @media (prefers-color-scheme: dark) { .problem { background: #522; color: #fcc; } }
  #stat { font-variant-numeric: tabular-nums; }
  pre { white-space: pre-wrap; font-size: .8rem; opacity: .8; }
</style>
</head>
<body>
<h1>この画面を Android に映す</h1>
<div id="problems"></div>

<div class="row">
  <label>解像度（上限）
    <select id="res">
      <option value="1280x720">1280 × 720</option>
      <option value="1920x1080" selected>1920 × 1080</option>
      <option value="2560x1440">2560 × 1440</option>
    </select>
  </label>
  <label>フレームレート
    <select id="fps">
      <option value="15">15 fps</option>
      <option value="30" selected>30 fps</option>
      <option value="60">60 fps</option>
    </select>
  </label>
  <label>ビットレート
    <select id="bps">
      <option value="2">2 Mbps</option>
      <option value="4">4 Mbps</option>
      <option value="8" selected>8 Mbps</option>
      <option value="12">12 Mbps</option>
      <option value="16">16 Mbps</option>
    </select>
  </label>
</div>

<div class="row">
  <button id="start" class="primary">共有を開始</button>
  <button id="stop" disabled>停止</button>
</div>
<p id="stat">待機中</p>
<pre id="log"></pre>

<script>
'use strict';
const $ = (id) => document.getElementById(id);

function log(message) {
  const el = $('log');
  el.textContent = new Date().toLocaleTimeString() + '  ' + message + '\n' + el.textContent.slice(0, 3000);
}

// このページが動くための前提を調べる
function findProblems() {
  const problems = [];
  if (!window.isSecureContext) {
    problems.push('このページは「安全なページ」として扱われていません。Chrome で chrome://flags/#unsafely-treat-insecure-origin-as-secure を開き、'
      + '「Insecure origins treated as secure」に ' + location.origin + ' を入力して「有効」にし、Chrome を再起動してください。');
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    problems.push('画面共有（getDisplayMedia）が使えません。');
  }
  if (typeof VideoEncoder === 'undefined' || typeof MediaStreamTrackProcessor === 'undefined') {
    problems.push('WebCodecs（VideoEncoder / MediaStreamTrackProcessor）が使えません。Chrome 94 以降が必要です。');
  }
  return problems;
}

const problems = findProblems();
for (const p of problems) {
  const div = document.createElement('div');
  div.className = 'problem';
  div.textContent = p;
  $('problems').appendChild(div);
}
if (problems.length > 0) $('start').disabled = true;

// ---- 送信 ----
let ws = null;
let stream = null;
let encoder = null;
let reader = null;
let running = false;
let needKey = true;       // 次のフレームをキーフレームにする
let frameCount = 0;
let sentBytes = 0;
let sentFrames = 0;
let lastEncodeAt = 0;
let lastFrame = null;     // 静止した画面でも映像が途切れないよう、最後のフレームを保持する
let timers = [];

const CODECS = ['avc1.42E033', 'avc1.42E02A', 'avc1.4D4033', 'avc1.640033']; // ベースライン / メイン / ハイ、レベル 4.2〜5.1

function openSocket() {
  return new Promise((resolve, reject) => {
    const s = new WebSocket('ws://' + location.host + '/ws');
    s.binaryType = 'arraybuffer';
    s.onopen = () => resolve(s);
    s.onerror = () => reject(new Error('Android に接続できません'));
    s.onclose = () => { if (running) { log('接続が切れました'); stop(); } };
    s.onmessage = (e) => {
      if (typeof e.data !== 'string') return;
      try { if (JSON.parse(e.data).type === 'keyframe') needKey = true; } catch (_) { /* 無視 */ }
    };
  });
}

async function pickEncoderConfig(base) {
  for (const hw of ['prefer-hardware', 'no-preference']) {
    for (const codec of CODECS) {
      const cfg = { ...base, codec, hardwareAcceleration: hw };
      const result = await VideoEncoder.isConfigSupported(cfg);
      if (result.supported) return result.config;
    }
  }
  throw new Error('この環境では、H.264 で圧縮できません');
}

function sendChunk(chunk) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const buf = new ArrayBuffer(9 + chunk.byteLength);
  const view = new DataView(buf);
  view.setUint8(0, chunk.type === 'key' ? 1 : 0);
  view.setBigInt64(1, BigInt(Math.round(chunk.timestamp)));
  chunk.copyTo(new Uint8Array(buf, 9));
  ws.send(buf);
  sentBytes += buf.byteLength;
  sentFrames++;
}

function encodeFrame(frame, fps) {
  const key = needKey || (frameCount % (fps * 2) === 0); // 2 秒ごと、または要求されたとき
  encoder.encode(frame, { keyFrame: key });
  if (key) needKey = false;
  frameCount++;
  lastEncodeAt = performance.now();
}

async function pump(fps) {
  const minInterval = 1000 / fps * 0.8;
  let lastAccepted = 0;
  while (running) {
    const { value: frame, done } = await reader.read();
    if (done || !frame) break;
    try {
      const now = performance.now();
      const tooFast = now - lastAccepted < minInterval;
      const congested = ws.bufferedAmount > 1500000 || encoder.encodeQueueSize > 4;
      if (tooFast || congested) continue; // 古い映像を溜めない（遅延を増やさない）
      lastAccepted = now;
      if (lastFrame) lastFrame.close();
      lastFrame = frame.clone();
      encodeFrame(frame, fps);
    } finally {
      frame.close();
    }
  }
}

async function start() {
  const [maxW, maxH] = $('res').value.split('x').map(Number);
  const fps = Number($('fps').value);
  const bitrate = Number($('bps').value) * 1000000;
  $('start').disabled = true;
  try {
    ws = await openSocket();
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { width: { ideal: maxW }, height: { ideal: maxH }, frameRate: { ideal: fps } },
      audio: false,
    });
    const track = stream.getVideoTracks()[0];
    track.addEventListener('ended', () => { log('共有が停止されました'); stop(); });
    const settings = track.getSettings();
    const width = (settings.width || maxW) & ~1;   // H.264 は偶数の大きさが必要
    const height = (settings.height || maxH) & ~1;

    const config = await pickEncoderConfig({
      width, height, bitrate, framerate: fps,
      latencyMode: 'realtime', avc: { format: 'annexb' },
    });
    log('共有を開始: ' + width + '×' + height + ' @' + fps + 'fps, ' + (bitrate / 1000000) + 'Mbps, ' + config.codec
      + (config.hardwareAcceleration ? ' (' + config.hardwareAcceleration + ')' : ''));

    encoder = new VideoEncoder({
      output: sendChunk,
      error: (e) => { log('エンコーダのエラー: ' + e.message); stop(); },
    });
    encoder.configure(config);

    running = true;
    needKey = true;
    frameCount = 0;
    sentBytes = 0;
    sentFrames = 0;
    ws.send(JSON.stringify({ type: 'config', width, height, fps }));
    $('stop').disabled = false;

    reader = new MediaStreamTrackProcessor({ track }).readable.getReader();
    pump(fps).catch((e) => { if (running) { log('送信のエラー: ' + e.message); stop(); } });

    timers.push(setInterval(() => { if (ws && ws.readyState === WebSocket.OPEN) ws.send('ping'); }, 2000));
    // 画面が静止していても、キーフレームの要求や接続の再開に応えられるよう、最後のフレームを定期的に送り直す
    timers.push(setInterval(() => {
      if (!running || !lastFrame || !encoder || encoder.state !== 'configured') return;
      if (performance.now() - lastEncodeAt < 500) return;
      if (ws.bufferedAmount > 1500000 || encoder.encodeQueueSize > 4) return;
      const copy = lastFrame.clone();
      try { encodeFrame(copy, fps); } finally { copy.close(); }
    }, 250));
    let lastBytes = 0, lastFrames = 0;
    timers.push(setInterval(() => {
      $('stat').textContent = '送信中: ' + (sentFrames - lastFrames) + ' fps, '
        + (((sentBytes - lastBytes) * 8) / 1000000).toFixed(1) + ' Mbps';
      lastBytes = sentBytes; lastFrames = sentFrames;
    }, 1000));
  } catch (e) {
    log('開始できませんでした: ' + e.message);
    stop();
  }
}

function stop() {
  const wasRunning = running;
  running = false;
  for (const t of timers) clearInterval(t);
  timers = [];
  try { if (reader) reader.cancel(); } catch (_) { /* 無視 */ }
  reader = null;
  if (stream) for (const t of stream.getTracks()) t.stop();
  stream = null;
  try { if (encoder && encoder.state !== 'closed') encoder.close(); } catch (_) { /* 無視 */ }
  encoder = null;
  if (lastFrame) { lastFrame.close(); lastFrame = null; }
  try { if (ws) ws.close(); } catch (_) { /* 無視 */ }
  ws = null;
  $('start').disabled = problems.length > 0;
  $('stop').disabled = true;
  $('stat').textContent = wasRunning ? '停止しました' : '待機中';
}

$('start').addEventListener('click', start);
$('stop').addEventListener('click', stop);
</script>
</body>
</html>
